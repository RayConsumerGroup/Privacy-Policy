<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back to YCYC</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f7fa;color:#14202b;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{max-width:420px;text-align:center}
  h1{font-size:22px;margin:0 0 12px}
  p{color:#55636f;line-height:1.5;margin:0 0 24px}
  a.btn{display:inline-block;background:#3fa9f5;color:#fff;text-decoration:none;font-weight:600;padding:14px 28px;border-radius:14px}
</style>
</head>
<body>
  <div class="card">
    <h1>Stripe setup submitted</h1>
    <p>Taking you back to the YCYC app. If nothing happens, tap the button below.</p>
    <a class="btn" href="ycyc://stripe-onboarding-complete">Open YCYC</a>
  </div>
  <script>
    // Best-effort automatic hand-off; some phones only allow it from a tap,
    // which is why the button above exists.
    setTimeout(function () { window.location.href = 'ycyc://stripe-onboarding-complete'; }, 300);
  </script>
</body>
</html>
